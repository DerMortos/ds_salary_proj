<!-- original prediction function html code for array input-->

<!-- templates/main.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="../static/style.css" rel="stylesheet" type="text/css">
    <title>Model Prediction</title>
</head>
<body>
    <form action="/predict" method="POST">
        <h1>Model Prediction</h1>
        <label for="input_data">Enter Input Data (comma-separated):</label><br>
<!--        <input type="text" id="input_data" name="input_data" placeholder="e.g., 5.1, 3.5, 1.4, 0.2">-->
        <textarea id="input_data" name="input_data" rows="10" cols="100">{{ data_in | join(', ') }}</textarea>
        <button type="submit">Predict</button>
        <p><a href="/selections">Select from list</a></p>

        {% if prediction is not none %}
        <h2>Estimated Salary: ${{ prediction }}K annually</h2>
        {% endif %}
    </form>


</body>
</html>
